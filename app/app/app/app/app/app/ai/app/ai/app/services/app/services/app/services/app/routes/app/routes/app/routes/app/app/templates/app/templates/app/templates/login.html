{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}

{% block content %}

<section class="auth-card">

    <p class="eyebrow">
        WELCOME BACK
    </p>

    <h1>
        Log in
    </h1>

    <form
        id="login-form"
        class="form"
    >

        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
            >

        </label>


        <button
            class="button"
            type="submit"
        >
            Log in
        </button>


        <p
            id="form-error"
            class="error"
        ></p>

    </form>


    <p>

        New here?

        <a href="/register">
            Create an account
        </a>

    </p>

</section>

{% endblock %}
