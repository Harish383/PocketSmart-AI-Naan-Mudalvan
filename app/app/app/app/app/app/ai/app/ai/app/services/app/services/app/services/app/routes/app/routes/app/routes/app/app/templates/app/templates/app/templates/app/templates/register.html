{% extends "base.html" %}

{% block title %}
Register — PocketSmart AI
{% endblock %}

{% block content %}

<section class="auth-card">

    <p class="eyebrow">
        GET STARTED
    </p>

    <h1>
        Create your account
    </h1>

    <form
        id="register-form"
        class="form"
    >

        <label>

            Name

            <input
                name="name"
                required
                minlength="2"
            >

        </label>


        <label>

            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                minlength="8"
                required
            >

        </label>


        <button
            class="button"
            type="submit"
        >
            Create account
        </button>


        <p
            id="form-error"
            class="error"
        ></p>

    </form>


    <p>

        Already registered?

        <a href="/login">
            Log in
        </a>

    </p>

</section>

{% endblock %}
